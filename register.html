<!DOCTYPE html>
<html>
<head>
<title>Register - LearnHub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f1f5f9}
.navbar{background:#0a2252;display:flex;justify-content:space-between;align-items:center;padding:15px 50px}
.navbar h2{color:white}
.navbar div a{color:white;text-decoration:none;margin-left:15px;font-size:14px;font-weight:bold}
.navbar div a:hover{color:yellow}
.reg-box{background:white;width:420px;margin:40px auto;padding:28px;border-radius:12px;border:1px solid #ddd;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
.reg-box h2{color:#0a2252;text-align:center;margin-bottom:5px}
.reg-box p.sub{color:gray;text-align:center;font-size:13px;margin-bottom:18px}
.reg-box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;outline:none}
.reg-box input:focus{border-color:#0a2252}
.reg-box button{width:100%;padding:12px;background:#0a2252;color:white;border:0;border-radius:6px;margin-top:12px;font-weight:bold;cursor:pointer;transition:0.3s}
.reg-box button:hover{background:orange;color:black;transform:scale(1.02)}
.reg-box .links{text-align:center;margin-top:15px;font-size:14px;color:gray}
.reg-box .links a{color:#0a2252;font-weight:bold;text-decoration:none}
.footer{background:#020617;color:white;text-align:center;padding:15px;margin-top:40px}
</style>
</head>
<body>

<div class="navbar">
<h2>LearnHub</h2>
<div>
<a href="index.html">Home</a>
<a href="courses.html">Courses</a>
<a href="instructors.html">Instructors</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
<a href="login.html">Login</a>
<a href="register.html">Register</a>
</div>
</div>

<div class="reg-box">
<h2>Create Account</h2>
<p class="sub">Join LearnHub today - Free</p>
<input type="text" placeholder="Full Name">
<input type="email" placeholder="Email Address">
<input type="text" placeholder="Mobile Number">
<input type="password" placeholder="Create Password">
<input type="password" placeholder="Confirm Password">
<button>Register Now</button>
<div class="links">
<p>Already have account? <a href="login.html">Login Here</a></p>
<p style="margin-top:8px"><a href="index.html">← Back to Home</a></p>
</div>
</div>

<div class="footer"><p>© 2025 LearnHub | Register</p></div>

</body>
</html>
