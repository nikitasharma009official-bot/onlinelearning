<!DOCTYPE html>
<html>
<head>
<title>Login - LearnHub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f1f5f9}
.navbar{background:#0a2252;display:flex;justify-content:space-between;align-items:center;padding:15px 50px}
.navbar h2{color:white}
.navbar div a{color:white;text-decoration:none;margin-left:15px;font-size:14px;font-weight:bold}
.navbar div a:hover{color:yellow}
.login-box{background:white;width:380px;margin:60px auto;padding:28px;border-radius:12px;border:1px solid #ddd;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
.login-box h2{color:#0a2252;text-align:center;margin-bottom:5px}
.login-box p.sub{color:gray;text-align:center;font-size:13px;margin-bottom:18px}
.login-box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;outline:none}
.login-box input:focus{border-color:#0a2252}
.login-box button{width:100%;padding:12px;background:#0a2252;color:white;border:0;border-radius:6px;margin-top:12px;font-weight:bold;cursor:pointer;transition:0.3s}
.login-box button:hover{background:orange;color:black;transform:scale(1.02)}
.login-box .links{text-align:center;margin-top:15px;font-size:14px;color:gray}
.login-box .links a{color:#0a2252;font-weight:bold;text-decoration:none}
.footer{background:#020617;color:white;text-align:center;padding:15px;margin-top:80px}
</style>
</head>
<body>

<div class="navbar">
<h2>LearnHub</h2>
<div>
<a href="index.html">Home</a>
<a href="courses.html">Courses</a>
<a href="instructors.html">Instructors</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
<a href="login.html">Login</a>
<a href="register.html">Register</a>
</div>
</div>

<div class="login-box">
<h2>Welcome Back</h2>
<p class="sub">Login to your LearnHub account</p>
<input type="email" placeholder="Email Address">
<input type="password" placeholder="Password">
<button>Login</button>
<div class="links">
<p>Don't have account? <a href="register.html">Register Here</a></p>
<p style="margin-top:8px"><a href="index.html">← Back to Home</a></p>
</div>
</div>

<div class="footer"><p>© 2025 LearnHub | Login</p></div>

</body>
</html>
